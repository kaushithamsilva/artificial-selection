[project]
name = "artificial-selection"
version = "0.1.0"
description = "Genetic-algorithm simulation of avian domestication: natural vs. artificial selection acting on egg yield, bone density, and energy."
readme = "README.md"
authors = [
    { name = "Kaushitha Silva", email = "kaushithamsilva@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
run-simulation = "artificial_selection.cli:app"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) as an argument default is the documented typer pattern.
"src/artificial_selection/cli.py" = ["B008"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
